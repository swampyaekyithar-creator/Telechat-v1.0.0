name: Build Telechat APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Fixed Debug Keystore
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Install Capacitor and Configure Android
        run: |
          npm install
          npx cap add android
          cp google-services.json android/app/google-services.json
          cp debug.keystore android/app/debug.keystore
          cat << 'GRADLE_EOF' >> android/variables.gradle

          ext {
            rgcfaIncludeGoogle = true
            androidxCredentialsVersion = '1.3.0'
          }
          GRADLE_EOF
          node << 'NODE_EOF'
          const fs = require('fs');
          const p = 'android/app/build.gradle';
          let s = fs.readFileSync(p, 'utf8');
          const signBlock = [
            '    signingConfigs {',
            '        debug {',
            '            storeFile file("debug.keystore")',
            '            storePassword "android"',
            '            keyAlias "androiddebugkey"',
            '            keyPassword "android"',
            '        }',
            '    }',
            '    buildTypes {'
          ].join('\n');
          s = s.replace('    buildTypes {', signBlock);
          s = s.replace('        release {', '        debug {\n            signingConfig signingConfigs.debug\n        }\n        release {');
          fs.writeFileSync(p, s, 'utf8');
          NODE_EOF
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />|' android/app/src/main/AndroidManifest.xml

      - name: Apply Custom App Icon
        run: |
          if [ -f icon.png ]; then
            python3 -c "import PIL" 2>/dev/null || pip install -q pillow
            python3 << 'PY_EOF'
          from PIL import Image
          import os
          src = Image.open("icon.png").convert("RGBA")
          densities = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }
          import glob
          res = "android/app/src/main/res"
          for old_f in glob.glob(os.path.join(res, "**", "ic_launcher*"), recursive=True):
              if os.path.isfile(old_f):
                  os.remove(old_f)
          for d, (sz, fg) in densities.items():
              out_dir = os.path.join(res, d)
              os.makedirs(out_dir, exist_ok=True)
              src.resize((sz, sz), Image.Resampling.LANCZOS).save(os.path.join(out_dir, "ic_launcher.png"))
              src.resize((sz, sz), Image.Resampling.LANCZOS).save(os.path.join(out_dir, "ic_launcher_round.png"))
              fg_canvas = Image.new("RGBA", (fg, fg), (255, 255, 255, 255))
              inner_sz = int(fg * 0.72)
              inner = src.resize((inner_sz, inner_sz), Image.Resampling.LANCZOS)
              off = (fg - inner_sz) // 2
              fg_canvas.paste(inner, (off, off), inner)
              fg_canvas.save(os.path.join(out_dir, "ic_launcher_foreground.png"))
          bg_xml = os.path.join(res, "values", "ic_launcher_background.xml")
          os.makedirs(os.path.dirname(bg_xml), exist_ok=True)
          with open(bg_xml, "w") as f:
              f.write("<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <color name=\"ic_launcher_background\">#FFFFFF</color>\n</resources>\n")
          anydpi = os.path.join(res, "mipmap-anydpi-v26")
          os.makedirs(anydpi, exist_ok=True)
          adaptive_xml = "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<adaptive-icon xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <background android:drawable=\"@color/ic_launcher_background\"/>\n    <foreground android:drawable=\"@mipmap/ic_launcher_foreground\"/>\n</adaptive-icon>\n"
          for name in ["ic_launcher.xml", "ic_launcher_round.xml"]:
              with open(os.path.join(anydpi, name), "w") as f:
                  f.write(adaptive_xml)
          print("Applied custom Telechat icon to all densities & adaptive-icon XML!")
          PY_EOF
          fi

      - name: Patch MainActivity for Mic and Camera
        run: |
          cat << 'JAVA_EOF' > android/app/src/main/java/com/telechat/app/MainActivity.java
          package com.telechat.app;

          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.webkit.PermissionRequest;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import com.getcapacitor.BridgeWebChromeClient;

          public class MainActivity extends BridgeActivity {
              private static final int REQ_MEDIA_PERMS = 1001;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  requestMediaPermissionsIfNeeded();
              }

              @Override
              public void onStart() {
                  super.onStart();
                  if (this.bridge != null && this.bridge.getWebView() != null) {
                      this.bridge.getWebView().setWebChromeClient(new BridgeWebChromeClient(this.bridge) {
                          @Override
                          public void onPermissionRequest(final PermissionRequest request) {
                              runOnUiThread(() -> request.grant(request.getResources()));
                          }
                      });
                  }
              }

              private void requestMediaPermissionsIfNeeded() {
                  String[] perms = new String[] {
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CAMERA
                  };
                  boolean need = false;
                  for (String p : perms) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) {
                          need = true;
                          break;
                      }
                  }
                  if (need) {
                      ActivityCompat.requestPermissions(this, perms, REQ_MEDIA_PERMS);
                  }
              }
          }
          JAVA_EOF
          npx cap sync android

      - name: Compile Debug APK and Verify SHA-1
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep SHA1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Telechat-Mobile-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
